<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hive</title>
    <link rel="stylesheet" href="./src/theme/tokens.css"/>
    <link rel="stylesheet" href="./src/theme/themes.css"/>
    <link rel="stylesheet" href="./src/style.css"/>
    <link rel="stylesheet" href="./src/theme/components/project-card.css"/>
    <link rel="stylesheet" href="./src/theme/components/chip.css"/>
    <link rel="stylesheet" href="./src/theme/components/session-row.css"/>
    <link rel="stylesheet" href="./src/theme/components/icon.css"/>
    <link rel="stylesheet" href="./src/theme/components/icon-button.css"/>
    <link rel="stylesheet" href="./src/theme/components/kbd.css"/>
    <link rel="stylesheet" href="./src/theme/components/button.css"/>
    <link rel="stylesheet" href="./src/theme/components/banner.css"/>
    <link rel="stylesheet" href="./src/theme/components/status-bar.css"/>
    <link rel="stylesheet" href="./src/theme/components/tile-header.css"/>
    <link rel="stylesheet" href="./src/theme/components/launcher-item.css"/>
    <link rel="stylesheet" href="./src/theme/components/empty-state.css"/>
    <link rel="stylesheet" href="./src/theme/components/dialog.css"/>
    <link rel="stylesheet" href="./src/theme/components/field.css"/>
    <!-- User token overrides. Declared here, after every preset, so they
         win by cascade ORDER. Filled synchronously by the script below
         and rewritten by src/theme/theme.ts. Never moved. -->
    <style id="theme-overrides"></style>
    <script>
      // Stamps data-theme and injects the user's token overrides before
      // first paint. A module script (src/theme/theme.ts) is deferred and
      // would let the first paint land on the wrong preset.
      //
      // The preset list is duplicated from PRESETS in src/theme/theme.ts —
      // keep them in sync. The overrides are NOT re-sanitised here: they
      // are stored already-sanitised (writeOverrides), and theme.ts
      // re-sanitises on import, which covers a hand-edited store one paint
      // later.
      try {
        var t = localStorage.getItem('hive.theme');
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'hive-dark' : 'hive-light';
        if (t !== 'classic' && t !== 'hive-dark' && t !== 'hive-light') t = 'classic';
        document.documentElement.dataset.theme = t;
        // The store is hand-editable, so it is shape-checked before it
        // reaches the <style>: declarations only, no block or tag
        // characters, no network-reaching function. This is a cheap
        // gate, not the sanitiser — theme.ts re-runs the real one on
        // import, one paint later.
        var o = localStorage.getItem('hive.themeOverrides');
        var ok = o && /^(?:--[a-z0-9-]+:[^;{}<>@]+;\s*)+$/.test(o) &&
          !/\b(?:url|image-set|src|expression)\s*\(/i.test(o);
        // ':root:root', not ':root': themes.css's preset blocks are
        // :root[data-theme="…"] (0,2,0) and would otherwise outrank
        // these. Kept in sync with applyOverrides in theme.ts.
        if (ok) document.getElementById('theme-overrides').textContent = ':root:root {\n  ' + o + '\n}';
      } catch (e) { document.documentElement.dataset.theme = 'classic'; }
    </script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header>
      <span class="brand">Hive</span>
      <button id="new-project-btn" title="New project (⌘N)" aria-label="New project"></button>
    </header>
    <ul id="projects"></ul>
    <!-- Projects the user minimized out of the list above. Pinned to
         the bottom of the sidebar, name only, one restore control each.
         Hidden (display: none) while the set is empty. -->
    <div id="minimized-projects" class="hidden" role="toolbar" aria-label="Minimized projects"></div>
    <!-- Version/build readout for hive (GUI) and hived (daemon).
         Both spans start empty: the daemon's version is only known
         once the control handshake lands, so app/version-footer.ts
         fills these from the "daemon:stale" event. #ver-daemon stays
         hidden while the builds match (the common case) and is
         revealed only on mismatch. -->
    <footer id="sidebar-hints" class="hints">
      <span id="ver-gui"></span><span id="ver-daemon" hidden></span>
    </footer>
    <div id="sidebar-resizer"
         role="separator"
         aria-orientation="vertical"
         aria-label="Resize sidebar"
         tabindex="0"
         title="Drag to resize (← / → to adjust, ⇧ for larger steps)"></div>
  </aside>
  <div id="launcher" class="hidden" role="menu"></div>
  <div id="command-palette" class="hidden" role="dialog" aria-label="Command palette">
    <input id="command-palette-input" type="text" placeholder="Search actions, shortcuts…" aria-label="Search commands" autocomplete="off"/>
    <div id="command-palette-list" role="listbox"></div>
  </div>
  <main id="terms" aria-label="Terminals"></main>
  <div id="empty-state" class="hidden"></div>
  <!-- Visible from the first paint: the daemon may take seconds to come
       up on a cold, busy machine, and a black pane with a "connecting…"
       status line reads as a broken app. Hidden by the first session
       list. -->
  <div id="boot-state" role="status" aria-live="polite">
    <div class="boot-state-card">
      <span class="phase-spinner" aria-hidden="true"></span>
      <span id="boot-state-text">Starting hive…</span>
    </div>
  </div>
  <div id="minimized-tray" class="hidden" role="toolbar" aria-label="Minimized sessions"></div>
  <!-- The live region is the text slot alone. With it on the bar, the
       mode hints re-announced on every navigation even though they only
       restate a static per-mode shortcut. -->
  <div id="status">
    <span id="status-text" role="status" aria-live="polite">connecting…</span>
    <span id="status-hint"></span>
  </div>
</div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
