name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Vet & Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            biome: true      # platform-independent, so Linux leg only
            go_e2e: true
            e2e_mock: true
            e2e_real: true
          - label: macOS
            os: macos-latest
            go_e2e: true
            # macOS catches webview-specific regressions that headless
            # Linux Chromium can't (WebGL atlas behaviour, DPR, fonts);
            # e2e_real on macOS too for wire-protocol parity.
            e2e_mock: true
            e2e_real: true
          - label: Windows
            os: windows-latest
            # No go_e2e / e2e_real: both need the unix-socket bridge
            # (spec 245 scopes Windows out). Vitest + the mock
            # Playwright suite DO run — Windows has the most
            # platform-specific frontend bug reports (#177, #183).
            e2e_mock: true

    # Pin the browser download location to one path that is the same on all
    # three OSes (the default differs: ~/.cache, ~/Library/Caches,
    # %LOCALAPPDATA%), so a single actions/cache entry covers every leg.
    # Job-level so the install step and both test steps resolve the same dir.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bootstrap Wails (seed dist, install CLI, generate bindings)
        # Shared with build.sh docs; pins the Wails CLI version in one place.
        shell: bash
        run: ./scripts/ci-bootstrap.sh

      - name: Build frontend
        # cmd/hivegui/main.go embeds frontend/dist via go:embed, so the
        # dist tree must exist before any `go build` / `go vet` / `go test`.
        working-directory: cmd/hivegui/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Typecheck (frontend — tsc)
        if: matrix.biome
        # Platform-independent, so it rides the same single-leg flag as Biome.
        # Placed right after the frontend build (and before the Go legs) so a
        # type error fails fast. `npm run build` does NOT type-check — Vite
        # transpiles .ts through esbuild without checking it, so this step is
        # the only real gate while the tree migrates to TypeScript.
        # From wave 4 on (when src/bridge.ts enters `include`) this needs the
        # generated wailsjs/ bindings — the Bootstrap step above already
        # produces them, so the ordering is right ahead of time.
        working-directory: cmd/hivegui/frontend
        run: npm run typecheck

      - name: UI lint (tokens / icons)
        if: matrix.biome
        run: ./scripts/ui-lint.sh --strict

      - name: UI lint self-test (fixtures)
        if: matrix.biome
        # The linter's own red/green proof was manual. Assert both fixtures
        # still behave: bad.css must fail, good.css must pass.
        run: |
          if ./scripts/ui-lint.sh --strict scripts/testdata/ui-lint/bad.css; then
            echo "expected bad.css to fail ui-lint" >&2
            exit 1
          fi
          ./scripts/ui-lint.sh --strict scripts/testdata/ui-lint/good.css

      - name: UI contrast (WCAG AA per preset)
        if: matrix.biome
        # Token values are platform-independent, so the Linux leg is enough.
        # --verbose so the log carries the ratios: when this goes red the
        # next question is always "by how much".
        run: ./scripts/ui-lint.sh --contrast --verbose

      - name: UI contrast self-test (fixtures)
        if: matrix.biome
        # Same shape as the ui-lint self-test above, and for the same reason:
        # this gate only ever runs against tokens that currently pass, so
        # without a known-bad fixture a regression in the ratio maths or the
        # light-ground branch would turn it into a rubber stamp silently.
        run: |
          if ./scripts/ui-lint.sh --contrast scripts/testdata/ui-contrast/bad.css; then
            echo "expected bad.css to fail ui-contrast" >&2
            exit 1
          fi
          ./scripts/ui-lint.sh --contrast scripts/testdata/ui-contrast/good.css

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Cache Go analysis tools
        if: matrix.biome
        # Both tools below are compiled from source. The steps that use
        # them skip `go install` when the binary is already present, so a
        # cache hit actually avoids the rebuild — without that guard the
        # unconditional install overwrites whatever was restored and the
        # cache buys nothing but its own latency. Keyed on the pinned
        # versions, so a bump misses exactly once.
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-analysis-tools-${{ runner.os }}-staticcheck2025.1.1-govulncheck1.7.0

      - name: Staticcheck (Go)
        if: matrix.biome
        # Platform-independent like Biome/tsc, so it rides the same
        # single-leg flag. `go vet` alone missed an unused assignment that
        # sat in registry/phase_test.go; this is the wider net. Pinned so a
        # new release can't turn a green PR red on its own.
        run: |
          BIN="$(go env GOPATH)/bin/staticcheck"
          [ -x "$BIN" ] || go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$BIN" ./...

      - name: Vulnerability scan (govulncheck)
        if: matrix.biome
        # Symbol-level: only reports vulns the code actually reaches.
        #
        # `go-version-file: go.mod` installs the `go` directive VERBATIM —
        # 1.25.0 means 1.25.0, not "latest 1.25.x". That is why the directive
        # names a patch release: on 1.25.0 this step reports three reachable
        # stdlib advisories fixed in 1.25.13. Verifying locally under a
        # different toolchain proves nothing about this step; match go.mod
        # (GOTOOLCHAIN=go1.25.14) when you do.
        #
        # The TOOL is pinned for the same reason staticcheck is — a tool
        # release must not turn a green PR red on its own. The advisory
        # DATABASE is still fetched live and deliberately so: that is the
        # point of the scan. So this step CAN go red on an untouched tree
        # when a new advisory lands. That is a real signal, not noise —
        # fix it by bumping the `go` directive to the patched release
        # rather than muting the step.
        run: |
          BIN="$(go env GOPATH)/bin/govulncheck"
          [ -x "$BIN" ] || go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$BIN" ./...

      - name: Test (Go)
        run: go test ./...
        env:
          TERM: dumb  # deterministic golden file output (no ANSI colors)

      - name: Test (Go e2e — real hived binary)
        if: matrix.go_e2e
        # Layer A: spawns the real hived binary in temp dirs and drives
        # it over the real wire protocol. Isolation enforced by env
        # vars below + testclient.RequireIsolation; never touches real
        # hive state. See docs/exec-plans/completed/210-real-e2e-tests.md.
        run: |
          export HOME="$(mktemp -d)"
          export HIVE_STATE_DIR="$(mktemp -d)"
          export HIVE_SOCKET="$(mktemp -d)/hived.sock"
          go test -tags=e2e -timeout 180s ./cmd/hived/...
        env:
          TERM: dumb

      - name: Lint & format check (frontend — Biome)
        if: matrix.biome
        # --reporter=github emits ::error/::warning workflow-command
        # annotations, which GitHub renders inline on the PR diff (and as
        # check annotations for findings outside the diff). Still exits
        # non-zero on real errors, so the gate is unchanged.
        working-directory: cmd/hivegui/frontend
        run: ./node_modules/.bin/biome ci --reporter=github .

      - name: Test (frontend unit + DOM)
        working-directory: cmd/hivegui/frontend
        run: ./node_modules/.bin/vitest run

      - name: Cache Playwright browsers
        if: matrix.e2e_mock
        # The single biggest cost in CI: this download was 219s of Windows's
        # 6m48s (vs 25s Linux, 13s macOS — Windows unzip is the outlier).
        #
        # Keyed on package.json, which works ONLY because @playwright/test is
        # pinned exactly there. A caret range would make this key constant
        # across every version bump, and the failure is silent and total: the
        # stale hit restores browser revision X, `playwright install`
        # re-downloads Y, and actions/cache skips the save because the key
        # already exists — so the 219s comes back forever behind a green
        # check. package-lock.json is gitignored here, so it cannot be the
        # key; the exact pin is what makes the version observable at all.
        # restore-keys warms a partial dir on the bump itself, where the
        # primary key correctly misses and a fresh entry does get saved.
        #
        # The install step below still runs on a hit — it is a fast no-op
        # when the browsers are present, and skipping it on cache-hit would
        # leave a leg with no browser if a cache were ever partial. On Linux
        # it also installs the apt deps, which are not cacheable.
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('cmd/hivegui/frontend/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: matrix.e2e_mock
        # Install BOTH the full chromium and the headless-shell variant.
        # Playwright defaults to headless-shell when CI=true; on macOS
        # CI the `install chromium` step alone has been observed to skip
        # the shell, leading to "Executable doesn't exist" at launch.
        working-directory: cmd/hivegui/frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium chromium-headless-shell

      - name: Assert every spec file is collected
        if: matrix.biome
        # Playwright reports a spec that matches no testMatch glob as ABSENT,
        # not as a failure, so a stale glob makes tests silently stop running
        # while this job stays green. Platform-independent, so it rides the
        # same single-leg flag as Biome and the typecheck.
        working-directory: cmd/hivegui/frontend
        run: node scripts/check-spec-discovery.mjs

      - name: Test (frontend E2E — mock Wails)
        if: matrix.e2e_mock
        working-directory: cmd/hivegui/frontend
        run: ./node_modules/.bin/playwright test
        env:
          CI: 'true'

      - name: Test (frontend E2E — real hived via ws-bridge)
        if: matrix.e2e_real
        # Layer B: spawns the real hived daemon + hived-ws-bridge in
        # temp dirs, points the Vite frontend at the bridge URL via
        # VITE_WAILS_REAL=1, runs Playwright. Catches wire/payload
        # drift that the mock harness cannot see. See
        # docs/exec-plans/completed/210-real-e2e-tests.md.
        working-directory: cmd/hivegui/frontend
        run: ./node_modules/.bin/playwright test --config=playwright.real.config.js
        env:
          CI: 'true'
          TERM: dumb

      - name: Upload Playwright failure artifacts
        # Traces + scrolltrace attachments are the only way to debug a
        # CI-only e2e failure (retain-on-failure traces land in
        # test-results/). Without this step they die with the runner.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.label }}
          path: cmd/hivegui/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
